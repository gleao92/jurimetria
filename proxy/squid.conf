# Proxy autenticado para o Tempestivo (saida com IP brasileiro)
# O PJe/DJEN bloqueia IPs fora do Brasil; o Railway nao tem regiao BR.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic children 5
auth_param basic realm Tempestivo-Proxy
auth_param basic credentialsttl 2 hours

acl autenticado proxy_auth REQUIRED
http_access allow autenticado
http_access deny all

http_port 0.0.0.0:3128
forwarded_for off
via off
